[project]
name = "visual-project-intelligence-search-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "boto3>=1.34.84",
    "pydantic>=2.7.1",
    "python-multipart>=0.0.9",
    "opensearch-py[async]>=2.6.0",
    "requests-aws4auth>=1.3.1",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
python = "3.12"
