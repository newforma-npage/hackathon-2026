<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004f9f"/>
      <stop offset="100%" stop-color="#009bb1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="10" fill="url(#bg)"/>
  <!-- Hexagon outline -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  <!-- Internal structural lines matching Newforma logo mark -->
  <line x1="24" y1="4"  x2="24" y2="44" stroke="white" stroke-width="1.4"/>
  <line x1="6"  y1="14" x2="42" y2="34" stroke="white" stroke-width="1.4"/>
  <line x1="42" y1="14" x2="6"  y2="34" stroke="white" stroke-width="1.4"/>
  <line x1="24" y1="4"  x2="42" y2="34" stroke="white" stroke-width="1"/>
  <line x1="24" y1="4"  x2="6"  y2="34" stroke="white" stroke-width="1"/>
</svg>
